<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLMS Calendar Sync</title>
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1a73e8;
    }

    .section {
      margin-bottom: 16px;
    }

    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    button:hover {
      background: #1557b0;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .status {
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .assignments-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
      font-size: 12px;
    }

    .assignment-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    .assignment-title {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .assignment-deadline {
      color: #666;
      font-size: 11px;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .note {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>📚 KLMS → カレンダー同期</h1>

  <div class="section">
    <div class="label">カレンダーアプリのURL:</div>
    <input type="text" id="appUrl" placeholder="http://localhost:8081">
    <div style="font-size: 11px; color: #666; margin-top: 4px;">
      ℹ️ ローカル開発: http://localhost:8081<br>
      ℹ️ 本番環境: https://calendar-todo-app-six.vercel.app
    </div>
  </div>

  <button id="syncButton">
    <span id="buttonText">課題を同期</span>
  </button>

  <div id="status" class="status"></div>

  <div id="assignmentsList" class="assignments-list" style="display: none;"></div>

  <div class="note">
    ⚠️ KLMSのページ (https://lms.keio.jp) で実行してください。
  </div>

  <script src="popup.js"></script>
</body>
</html>
